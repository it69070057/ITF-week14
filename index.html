<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Card และ To-do List</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* จัดการ์ดให้อยู่กึ่งกลางหน้าเว็บ */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Noto Sans Thai", "Sarabun", Tahoma, sans-serif;
      background: #dfe6ee;
      color: #1f2a37;
    }

    /* การ์ดใบเดียว: พื้นหลังต่างจากหน้า มีขอบมนและเงา */
    .card {
      display: flex;
      width: 100%;
      max-width: 820px;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(31, 42, 55, 0.18);
    }

    /* ---------- ฝั่งซ้าย: โปรไฟล์ ---------- */
    .profile {
      flex: 0 0 300px;
      padding: 36px 28px;
      background: #ff72c9;
      color: #ffffff;
      text-align: center;
    }

    .profile img {
      width: 120px;
      height: 120px;
      margin-bottom: 16px;
      border-radius: 50%;
      border: 4px solid #060606;
      object-fit: cover;
    }

    .profile h1 {
      font-size: 26px;
    }

    .profile p {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .profile .student-info {
      color: #ffffff;
      font-weight: 700;
    }

    .profile a {
      display: inline-block;
      margin-top: 16px;
      color: #ffffff;
      font-size: 14px;
    }

    .profile a:hover {
      color: #f2b84b;
    }

    /* ---------- ฝั่งขวา: To-do List ---------- */
    .todo {
      flex: 1;
      padding: 36px 32px;
    }

    .todo h2 {
      margin-bottom: 18px;
      font-size: 22px;
      color: #1f3a5f;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    #todo-input {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      font-family: inherit;
      border: 1px solid #b8c3d1;
      border-radius: 8px;
    }

    #todo-input:focus,
    button:focus-visible {
      outline: 3px solid #f2b84b;
      outline-offset: 1px;
    }

    button {
      padding: 10px 16px;
      font-size: 14px;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #add-btn {
      background: #1f3a5f;
      color: #ffffff;
    }

    #add-btn:hover {
      background: #2b4f80;
    }

    #todo-list {
      padding-left: 20px;
    }

    #todo-list li {
      padding: 10px 0;
      border-bottom: 1px solid #e3e8ee;
    }

    /* ให้ปุ่มลบอยู่ท้ายแต่ละข้อ */
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .delete-btn {
      padding: 6px 12px;
      background: #fde8e8;
      color: #b42318;
    }

    .delete-btn:hover {
      background: #fbd0d0;
    }
    @media (max-width: 640px) {
      .card {
        flex-direction: column;
      }
      .profile {
        flex: none;
      }
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="profile">
      <img src="babikato.jpeg" alt="รูปโปรไฟล์ของ ณิชานันท์">
      <h1>ณิชานันทน์</h1>
      <p class="student-info">รหัสนักศึกษา 69070057<br>สาขาเทคโนโลยีสารสนเทศ KMITL</p>
      <p>ชอบกินชาเขียว ชอบกินช็อคโกแลต ชอบดูบาร์บี้ อยากเป็นเจ้าหญิง
      </p>
      <a href="mailto:69070057@kmitl.ac.th">69070057@kmitl.ac.th</a>
    </div>
    <div class="todo">
      <h2>To-do List</h2>

      <div class="add-row">
        <input type="text" id="todo-input" placeholder="พิมพ์สิ่งที่ต้องทำ...">
        <button type="button" id="add-btn">เพิ่ม</button>
      </div>

      <ul id="todo-list">
        <li><div class="item"><span>เรียนบริหารสเน่เจ้าหญิง</span><button type="button" class="delete-btn">ลบ</button></div></li>
        <li><div class="item"><span>หัดใช้ปีกแฟรี่</span><button type="button" class="delete-btn">ลบ</button></div></li>
        <li><div class="item"><span>หัดใช่ครีบนางเงือก</span><button type="button" class="delete-btn">ลบ</button></div></li>
        <li><div class="item"><span>รำติ้กต่อก</span><button type="button" class="delete-btn">ลบ</button></div></li>
      </ul>
    </div>

  </div>
</body>
</html>
